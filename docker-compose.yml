services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: mini-services/backend/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["3001:3001"]
    entrypoint: ["/bin/sh","/app/docker-entrypoint.sh","npm","run","start"]

  chat:
    build:
      context: ./mini-services/chat-service
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - postgres
    ports: ["3004:3004"]
    entrypoint: ["/bin/sh","/app/docker-entrypoint.sh","node","index.js"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
