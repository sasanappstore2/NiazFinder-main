name: V2 Intake Nightly QA

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  golden-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Full golden replay (858)
        run: npm run test:v2-conv-golden
        env:
          NEED_INTAKE_LLM_ENABLED: 'false'
      - name: V2 scenario matrix
        run: npm run test:v2-scenarios
        env:
          NEED_INTAKE_LLM_ENABLED: 'false'
