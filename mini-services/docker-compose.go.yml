# Docker Compose overlay for Go chat replacement (chat-go).
# RabbitMQ + worker-go are in the root docker-compose.yml.
#
# Usage: docker compose -f docker-compose.yml -f mini-services/docker-compose.go.yml up chat-go

services:
  chat-go:
    build:
      context: ./mini-services/chat-go
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    env_file: .env
    environment:
      PORT: "3004"
      DATABASE_URL: postgresql://${POSTGRES_USER:-needfinder}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-needfinder}?schema=public
      REDIS_URL: redis://redis:6379
      COMM_REDIS_CHANNEL: ${COMM_REDIS_CHANNEL:-comm:events}
      CHAT_SEND_RATE_PER_MIN: ${CHAT_SEND_RATE_PER_MIN:-60}
      CHAT_INTERNAL_SECRET: ${CHAT_INTERNAL_SECRET:-${INTERNAL_API_SECRET}}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3004:3004"
    restart: unless-stopped
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health | grep -q '\"ok\":true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# To switch from Node chat-service to chat-go, comment out the legacy `chat:` service
# and set NEXT_PUBLIC_CHAT_SOCKET_URL to the same host with WebSocket path /ws?token=...
