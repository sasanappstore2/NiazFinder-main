# coturn — TLS on 443 (Iran ISP friendly)
listening-port=3478
tls-listening-port=443
listening-ip=0.0.0.0
relay-ip=0.0.0.0
fingerprint
use-auth-secret
static-auth-secret=${TURN_STATIC_AUTH_SECRET:-change-me-turn-secret}
realm=needfinder
no-multicast-peers
no-cli
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
